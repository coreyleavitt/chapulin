name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Deps are resolved with MILPA, not nimble (nimble can't evaluate softlink's
# .nimble and doesn't know the milpa-managed dev-deps). scripts/ci.sh installs
# milpa, runs `milpa fetch`, then drives nim directly -- the local dev loop,
# minus the Docker container (CI runs nim natively on each runner).
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # oyamel's GTK4 backend (Linux GUI) + the headless GTK4 runtime smoke.
      # Windows uses the Win32 backend; macOS is CLI-only.
      - name: Install GTK4 dev + Xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev xvfb dbus-x11

      - name: Build + test (milpa + nim)
        shell: bash
        run: bash scripts/ci.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: milpa fetch + nim check (strict hints)
        shell: bash
        run: |
          set -euo pipefail
          export MILPA_CACHE_DIR="$PWD/.milpa-cache"
          pipx install "git+https://github.com/coreyleavitt/milpa.git#subdirectory=impls/python"
          export PATH="$(pipx environment --value PIPX_BIN_DIR):$PATH"
          milpa -C . lock    # re-lock per-OS: committed lock's hashes are line-ending-specific
          milpa -C . fetch
          nim check --hints:on src/chapulin.nim
