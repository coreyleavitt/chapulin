name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # oyamel's GTK4 backend is the Linux GUI backend (the old GTK3 dep is
      # gone). macOS has no oyamel backend yet, so it builds CLI-only (no GTK).
      - name: Install GTK4 dev (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev

      - name: Install dependencies
        run: nimble install -d -y

      - name: Run unit tests
        run: nimble test

      # GUI build gate — `nim c` (link), the backend define comes from the
      # committed config.nims (oyamelWin32 on Windows, oyamelGtk4 on Linux).
      # macOS is CLI-only: oyamel ships no Cocoa backend, so it does NOT build
      # -d:withGui (see docs/rfc/gui-oyamel-port.md §6.0).
      - name: Build (with GUI — Windows + Linux)
        if: runner.os != 'macOS'
        run: nim c --threads:on -d:withGui -d:release -o:chapulin src/chapulin.nim

      - name: Build (CLI only — macOS)
        if: runner.os == 'macOS'
        run: nim c --threads:on -d:release -o:chapulin src/chapulin.nim

      # GTK4 runtime smoke (Linux): prove the GUI actually instantiates on the
      # real GTK4 backend, not just links. -d:chapulinGuiSmokeQuit opens the
      # window, runs the pump, then self-quits (gui-oyamel-port §5 slice 4).
      - name: GUI headless smoke (Linux/GTK4)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb dbus-x11
          nim c --threads:on -d:withGui -d:chapulinGuiSmokeQuit -o:chapulin-gui-smoke src/chapulin.nim
          xvfb-run -a dbus-run-session -- ./chapulin-gui-smoke gui

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: nimble install -d -y

      - name: Check compilation (strict hints)
        run: nim check --hints:on src/chapulin.nim
