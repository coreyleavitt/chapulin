services:
  # Unit + property suite. Precondition: run `milpa fetch` on the host first so
  # the bind-mounted tree contains nim.cfg + _deps/ (deps are not resolved in
  # the image). Mirrors scripts/dev-test.ps1 and the nimble `test` task; runs
  # nim directly rather than nimble so the milpa-generated nim.cfg is the single
  # source of dependency paths. ($$ escapes compose interpolation.)
  dev:
    build: .
    volumes:
      - .:/app
    working_dir: /app
    # Single-line sh -c: a YAML '>' folded scalar preserves newlines on
    # more-indented continuation lines, which breaks the `for ... in` list.
    command: sh -c "for t in t_protocol t_transfer t_options t_security t_server t_logging t_uri t_client t_api t_props t_props_transfer t_props_server t_wireharness t_session; do nim c -r --hints:off -d:chapulinTest tests/$$t.nim || exit 1; done"

  # Direction 1: our client against third-party server
  tftp-server:
    image: pghalliday/tftp
    ports:
      - "69:69/udp"
    volumes:
      - ./test-files:/var/tftpboot

  integration-client:
    build: .
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - tftp-server
    command: nim c -r tests/t_integration.nim
    environment:
      - TFTP_HOST=tftp-server
      - TFTP_PORT=69

  # Direction 2: third-party client against our server
  our-server:
    build: .
    volumes:
      - .:/app
      - ./test-files:/srv/tftp
    working_dir: /app
    command: >
      bash -c "nim c -o:/tmp/chapulin src/chapulin.nim 2>/dev/null &&
               /tmp/chapulin serve /srv/tftp --port=6969 --write=all --timeout=5"

  interop-external-client:
    image: opensuse/tumbleweed
    depends_on:
      - our-server
    network_mode: "service:our-server"
    entrypoint: ["bash", "-c"]
    command:
      - |
        zypper install -y atftp 2>/dev/null
        sleep 3
        echo "=== Test 1: GET small file with atftp ==="
        atftp --get --remote-file hello.txt --local-file /tmp/hello.txt 127.0.0.1 6969
        if [ -s /tmp/hello.txt ]; then
          echo "PASS: $$(cat /tmp/hello.txt)"
        else
          echo "FAIL: file empty or missing"
          exit 1
        fi
        echo "=== Test 2: GET 10KB file with atftp ==="
        atftp --get --remote-file random.bin --local-file /tmp/random.bin 127.0.0.1 6969
        SIZE=$$(wc -c < /tmp/random.bin)
        if [ "$$SIZE" -eq 10240 ]; then
          echo "PASS: $$SIZE bytes"
        else
          echo "FAIL: expected 10240 bytes, got $$SIZE"
          exit 1
        fi
        echo "=== Test 3: GET with blocksize option ==="
        atftp --option "blksize 1024" --get --remote-file random.bin --local-file /tmp/random2.bin 127.0.0.1 6969
        SIZE=$$(wc -c < /tmp/random2.bin)
        if [ "$$SIZE" -eq 10240 ]; then
          echo "PASS: $$SIZE bytes with blksize=1024"
        else
          echo "FAIL: expected 10240 bytes, got $$SIZE"
          exit 1
        fi
        echo "=== Test 4: GET nonexistent file ==="
        atftp --get --remote-file nonexistent.txt --local-file /tmp/nope.txt 127.0.0.1 6969 2>&1 || true
        if [ ! -s /tmp/nope.txt ]; then
          echo "PASS: correctly rejected"
        else
          echo "FAIL: should not have succeeded"
          exit 1
        fi
        echo "=== Test 5: PUT with atftp ==="
        echo "uploaded by atftp" > /tmp/upload.txt
        atftp --put --remote-file uploaded_atftp.txt --local-file /tmp/upload.txt 127.0.0.1 6969
        echo "PASS: PUT completed (exit $$?)"
        echo ""
        echo "=== ALL EXTERNAL CLIENT INTEROP TESTS PASSED ==="

  # --- Capture point for RFC verification-harness-v2.md Part C, slice C3 ----
  # (docs/rfc/verification-harness-v2.md §3.3/§5). Test-infra only, no src/
  # change -- see Dockerfile.pcap's header comment for why this is the
  # RFC's "tcpdump sidecar" option (not the "chapulin debug hook" option,
  # which would be a second src/ change and is out of scope for this RFC).
  #
  # Both sidecars capture with a PLAIN `udp` filter -- no port clause.
  # TFTP's request goes to a well-known port, but the server's DATA/ACK
  # reply comes from a freshly allocated PER-TRANSFER ephemeral port; a
  # port-filtered capture would silently drop everything after the initial
  # RRQ/WRQ. See tests/interopcapture.nim's module doc comment for the full
  # writeup (harvest side of this same finding) and for the
  # `harvestPcapFile` manual entry point that turns a `.pcap` dropped in
  # ./interop-captures/ into committed `tests/corpus/` seeds.
  #
  # Not verified live in the authoring session: this repo's local Docker
  # engine is pinned to Windows containers, and these two Linux-only
  # services (like tftp-server/interop-external-client above) cannot start
  # there at all (`docker pull alpine` itself fails with "image operating
  # system \"linux\" cannot be used on this platform"). Run under a
  # Linux-container Docker engine, e.g.:
  #   docker compose up --build tftp-server integration-client pcap-tftp-server
  #   docker compose up --build our-server interop-external-client pcap-our-server
  # then harvest each resulting ./interop-captures/*.pcap via:
  #   nim c -r tests/interopcapture.nim ./interop-captures/direction1-tftp-server.pcap protocol.decode
  #   nim c -r tests/interopcapture.nim ./interop-captures/direction2-our-server.pcap protocol.decode unverified
  # (the second uses the `unverified` flag -- Direction 2's own compose
  # script includes the always-PASS atftp-PUT leg, see docker-compose.yml's
  # own "Test 5" comment above and tests/interopcapture.nim's
  # `interopCaptureUnverifiedTaggedId` doc comment).

  # Direction 1 capture: our client (integration-client) -> third-party
  # tftp-server. Shares tftp-server's own network namespace (the same
  # `network_mode: "service:X"` trick interop-external-client already uses
  # below) so it sees tftp-server's real interface traffic -- a genuine
  # Ethernet link over the default bridge network (pcap linktype 1,
  # DLT_EN10MB).
  pcap-tftp-server:
    build:
      context: .
      dockerfile: Dockerfile.pcap
    network_mode: "service:tftp-server"
    depends_on:
      - tftp-server
    volumes:
      - ./interop-captures:/captures
    command:
      - "timeout 90 tcpdump -i eth0 -w /captures/direction1-tftp-server.pcap udp || true"

  # Direction 2 capture: third-party atftp client -> our server. atftp
  # (interop-external-client) and our-server already share ONE network
  # namespace (both declare `network_mode: "service:our-server"`), so their
  # traffic crosses the LOOPBACK interface, not Ethernet -- pcap linktype 0
  # (DLT_NULL/DLT_LOOPBACK). Includes the atftp-PUT leg (Test 5) -- harvest
  # that leg with the `unverified` flag, per the always-PASS caveat above.
  pcap-our-server:
    build:
      context: .
      dockerfile: Dockerfile.pcap
    network_mode: "service:our-server"
    depends_on:
      - our-server
    volumes:
      - ./interop-captures:/captures
    command:
      - "timeout 90 tcpdump -i lo -w /captures/direction2-our-server.pcap udp || true"
