# Auto-loaded by nim for EVERY main module compiled from this directory
# (Nim's config loader loads a bare `nim.cfg` per-directory, not just
# `<module>.nim.cfg`) — so this one file is what reaches every
# coverage-guided fuzz property's compile, instead of a per-suite
# `t_props.nim.cfg` / `t_netascii.nim.cfg` / ... copy (RFC
# verification-harness.md D2, round 3).
#
# Harmless on test files that don't `import coverpragma` — it only
# changes what that one shim module (src/chapulin/coverpragma.nim)
# compiles to; every other file simply carries an unused define.
--define:chapulinFuzz
